<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fastdds_transport_viz viewer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="title">fastdds_transport_viz <span class="sub">web viewer</span></div>
  <div class="meta" id="meta">no document loaded</div>
  <div class="live" id="live" hidden><span class="dot"></span><span id="live-text">live</span> <button class="btn" id="live-pause">Pause</button></div>
  <div class="actions">
    <label class="btn">Open JSON… <input type="file" id="file" accept=".json,application/json" hidden></label>
    <button class="btn" id="load-sample">Load sample</button>
    <span class="hint">or drop a <code>transport_viz --json</code> file anywhere</span>
  </div>
</header>

<div class="toolbar">
  <div class="group">
    <button class="tab active" data-view="graph">Graph</button>
    <button class="tab" data-view="table">Table</button>
  </div>
  <div class="group">
    <label>Topic <input type="text" id="filter-topic" placeholder="regex, e.g. ^/chatter"></label>
  </div>
  <div class="group" id="filter-transports"></div>
  <div class="group">
    <label><input type="checkbox" id="filter-internal" checked> hide ROS internal topics</label>
  </div>
  <div class="group legend" id="legend"></div>
</div>

<main>
  <section id="graph-view" class="view">
    <svg id="graph"></svg>
  </section>
  <section id="table-view" class="view" hidden>
    <table id="pairs-table">
      <thead><tr id="pairs-head"></tr></thead>
      <tbody id="pairs-body"></tbody>
    </table>
  </section>
  <aside id="panel">
    <div class="panel-empty">Click a node or an edge for details.</div>
  </aside>
</main>

<div id="drop-overlay" hidden>Drop the JSON file to load it</div>

<script src="vendor/d3.v7.min.js"></script>
<script src="sample/sample.js"></script>
<script src="app.js"></script>
</body>
</html>
