name: Feature request
description: Propose a new reason code, column, transport scenario, or other change
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What's missing or awkward today
      description: What are you trying to find out about your DDS traffic that the tool doesn't tell you (or makes hard to tell)?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What you'd want the tool to do instead — a new column, a new reason code, a new `--flag`, a new transport scenario to detect, etc.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workaround you're already using, or other approaches you considered.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: The setup this matters for (ROS distro, transport, single/multi-host, ...), links to related issues, etc.
    validations:
      required: false
