name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: colcon build & test (ROS 2 Jazzy)
    runs-on: ubuntu-latest
    container: ros:jazzy
    defaults:
      run:
        shell: bash
    steps:
      - name: Install git for checkout
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git

      - uses: actions/checkout@v4

      - name: Install dependencies (rosdep)
        run: |
          rosdep update --rosdistro jazzy
          rosdep install --from-paths src --ignore-src --rosdistro jazzy -y

      - name: Build
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --symlink-install --event-handlers console_cohesion+

      - name: Test
        env:
          RMW_IMPLEMENTATION: rmw_fastrtps_cpp
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          colcon test --event-handlers console_cohesion+ --return-code-on-test-failure
          colcon test-result --verbose

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/**/test_results/**/*.xml
            log/latest_test/**/*.log
          if-no-files-found: ignore

  integration:
    # Multi-container scenarios (scripts/integration_test.sh) on the x86_64 runner VM:
    # bridged containers => UDPv4, --stats across containers, host network/IPC => SHM.
    # Skipped for pull requests to keep PR CI short; run it by hand with workflow_dispatch.
    name: multi-container integration (x86_64)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run scenarios
        run: scripts/integration_test.sh all

      - name: Upload transport_viz output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-json
          path: /tmp/transport_viz_*.json
          if-no-files-found: ignore
