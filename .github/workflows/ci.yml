name: CI

# Always triggered (path filters in `on:` would leave the required checks of main's
# branch protection pending); jobs skip themselves for docs-only changes, and a skipped
# required check counts as passed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  changes:
    name: changed paths
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          # 'every': a changed file counts only if it matches all patterns, i.e. it is
          # not documentation. With the default 'some', each negated pattern alone
          # matches almost any file and docs-only changes still ran the matrix.
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**.md'
              - '!mkdocs.yml'
              - '!.github/workflows/docs.yml'

  build-and-test:
    name: colcon build & test (ROS 2 ${{ matrix.distro }}, ${{ matrix.arch }}, ${{ matrix.rmw }})
    # Pull requests validate the code (required checks of main's protection); the merge
    # commit on main only runs the multi-container job below. Docs-only changes skip it.
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && needs.changes.outputs.code == 'true')
    # GitHub-hosted arm64 runners have no floating label, hence the fixed name.
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    # Queue time does not count; the jobs themselves take 6-7 minutes on x86_64.
    timeout-minutes: 30
    # ros:<distro> images are multi-arch, so the same tag serves both runners.
    container: ros:${{ matrix.distro }}
    # Humble: Fast DDS 2.6 (no statistics module in the binary); Jazzy: Fast DDS 2.14;
    # Lyrical: Fast DDS 3.6; Rolling: Fast DDS 3.x head, may break with upstream changes,
    # so it does not block PRs.
    continue-on-error: ${{ matrix.distro == 'rolling' }}
    strategy:
      fail-fast: false
      matrix:
        distro: [humble, jazzy, lyrical, rolling]
        arch: [x86_64]
        rmw: [rmw_fastrtps_cpp]
        # arm64 for the two LTS distributions the bloom release targets; Humble on arm64
        # adds little (Fast DDS 2.6, prediction only) and Rolling on arm64 belongs to the
        # scheduled Rolling run (#79). arm64 blocks pull requests like x86_64 does.
        # rmw_fastrtps_dynamic_cpp (#73): same suite on the released distros, x86_64 only;
        # it blocks pull requests like the default RMW does.
        include:
          - distro: jazzy
            arch: arm64
            rmw: rmw_fastrtps_cpp
          - distro: lyrical
            arch: arm64
            rmw: rmw_fastrtps_cpp
          - distro: humble
            arch: x86_64
            rmw: rmw_fastrtps_dynamic_cpp
          - distro: jazzy
            arch: x86_64
            rmw: rmw_fastrtps_dynamic_cpp
          - distro: lyrical
            arch: x86_64
            rmw: rmw_fastrtps_dynamic_cpp
    defaults:
      run:
        shell: bash
    steps:
      - name: Install git for checkout
        run: |
          apt-get update
          # The ros:<distro> image lags the apt repo: rosdep then installs freshly rebuilt
          # packages (example_interfaces) next to stale preinstalled ones (service_msgs) and
          # demo_nodes_cpp dies with an undefined typesupport symbol. Upgrade first.
          apt-get upgrade -y --no-install-recommends
          apt-get install -y --no-install-recommends git iproute2   # iproute2: Easy Mode finds its server with `ss`

      - uses: actions/checkout@v4

      - name: Install dependencies (rosdep)
        run: |
          rosdep update --rosdistro ${{ matrix.distro }}
          rosdep install --from-paths src --ignore-src --rosdistro ${{ matrix.distro }} -y

      - name: Build
        run: |
          source /opt/ros/${{ matrix.distro }}/setup.bash
          colcon build --symlink-install --event-handlers console_cohesion+

      - name: Test
        env:
          RMW_IMPLEMENTATION: ${{ matrix.rmw }}
        run: |
          source /opt/ros/${{ matrix.distro }}/setup.bash
          source install/setup.bash
          colcon test --event-handlers console_cohesion+ --return-code-on-test-failure
          colcon test-result --verbose

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.distro }}-${{ matrix.arch }}-${{ matrix.rmw }}
          path: |
            build/**/test_results/**/*.xml
            log/latest_test/**/*.log
          if-no-files-found: ignore

  integration:
    # Multi-container scenarios (scripts/integration_test.sh) on the runner VM, once per
    # architecture: bridged containers => UDPv4, --stats across containers (also with tc netem
    # loss => RTPS_LOST direction), host
    # network/IPC => SHM, host network without its IPC => shm-not-visible, host network with an IPC namespace per
    # node => shm-ipc-namespace-split (also with --stats and with data-sharing), LARGE_DATA => TCPv4, DEFAULTv6 => UDPv6, plus the Easy Mode pair
    # on the lyrical image. Runs for the merge commit on main (and workflow_dispatch), not
    # for pull requests, to keep PR CI short.
    name: multi-container integration (${{ matrix.arch }}, ${{ matrix.distro }})
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && needs.changes.outputs.code == 'true')
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    # Includes `docker compose build dev` of the multi-arch image; about 3 minutes on x86_64.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
        distro: [jazzy]
        scenarios: [all]
        include:
          # Easy Mode (ROS2_EASY_MODE) needs Fast DDS 3.2+: the two scenarios that the
          # jazzy image skips, on the lyrical image, plus hostnet_noipc_shm (rclcpp there
          # creates no endpoint on the tool's rmw participant, #51) and the split IPC
          # scenarios (#101, #106, #110, #118).
          - arch: x86_64
            distro: lyrical
            scenarios: easy_mode_shm easy_mode_tcp hostnet_noipc_shm hostnet_split_shm hostnet_split_shm_visible hostnet_split_shm_shared_port hostnet_split_stats hostnet_split_datasharing hostnet_split_datasharing_udp
          # Humble (Fast DDS 2.6) has no 7000+ port, but its pid-based SHM ports are
          # numbered per IPC namespace too, so the split shows as a port collision; the
          # visible and UDPv4-only variants skip there.
          - arch: x86_64
            distro: humble
            scenarios: hostnet_split_shm hostnet_noipc_shm hostnet_split_datasharing
    env:
      ROS_DISTRO: ${{ matrix.distro }}
    steps:
      - uses: actions/checkout@v4

      - name: Run scenarios
        run: |
          for s in ${{ matrix.scenarios }}; do scripts/integration_test.sh "$s"; done

      - name: Upload transport_viz output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-json-${{ matrix.arch }}-${{ matrix.distro }}
          path: /tmp/transport_viz_*.json
          if-no-files-found: ignore

  web-unit-tests:
    # web/model.js and web/scene.js (the viewer's pure model/formatting/layout functions) under Node's test runner.
    name: web viewer unit tests (node)
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && needs.changes.outputs.code == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --version && node --test "web/test/*.test.js"

  # Single check for main's branch protection: succeeds when every job above passed or
  # was skipped (a skipped matrix job reports an unexpanded name, so the per-distro /
  # per-arch names cannot be required directly). Rolling is continue-on-error and does
  # not count.
  ci-result:
    name: CI result
    needs: [changes, build-and-test, integration, web-unit-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "build-and-test: ${{ needs.build-and-test.result }}"
          echo "integration: ${{ needs.integration.result }}"
          echo "web-unit-tests: ${{ needs.web-unit-tests.result }}"
          case "${{ needs.build-and-test.result }}" in success|skipped) ;; *) exit 1 ;; esac
          case "${{ needs.integration.result }}" in success|skipped) ;; *) exit 1 ;; esac
          case "${{ needs.web-unit-tests.result }}" in success|skipped) ;; *) exit 1 ;; esac
