# Documentation site, built with Zensical (https://zensical.org/). This file is the English
# site (docs/*.md into site/); scripts/build_docs.py also derives the Japanese one from it
# (docs/*.ja.md into site/ja/, see [i18n.ja.nav] at the end). Build both with
#   python3 scripts/build_docs.py [--serve]
[project]
site_name = "fastdds_transport_viz"
site_description = "Which Fast DDS transport each ROS 2 topic is communicated over, and why"
site_url = "https://atinfinity.github.io/fastdds_transport_viz/"
repo_url = "https://github.com/atinfinity/fastdds_transport_viz"
repo_name = "atinfinity/fastdds_transport_viz"
edit_uri = "edit/main/docs/"
docs_dir = "docs"
site_dir = "site"

nav = [
  { "Home" = "index.md" },
  { "User guide" = [
    { "Getting started" = "getting-started.md" },
    { "How it works" = "how-it-works.md" },
    { "Measured transports (--stats)" = "statistics.md" },
    { "Data-sharing (zero-copy)" = "data-sharing.md" },
    { "Web viewer" = "web-viewer.md" },
  ] },
  { "Developer guide" = [
    { "Architecture" = "architecture.md" },
    { "Development, verification and tests" = "development.md" },
    { "Verification log" = "verification-log.md" },
  ] },
]

# Broken links and #anchors fail `zensical build --strict` (scripts/build_docs.py). Pages
# outside docs/ and the GitHub rendering are checked by lychee in .github/workflows/docs.yml.
[project.validation]
invalid_links = true
invalid_link_anchors = true

# The language selector. It keeps the current page: each build links the other language with
# <link rel="alternate" hreflang> and looks the page up in that language's sitemap.xml.
[project.extra]
alternate = [
  { name = "English", link = "/fastdds_transport_viz/", lang = "en" },
  { name = "日本語", link = "/fastdds_transport_viz/ja/", lang = "ja" },
]

[project.theme]
language = "en"
features = [
  "navigation.top",
  "navigation.footer",
  "content.code.copy",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to light mode"

# The translations and requirements.txt are not pages of the English site.
[project.plugins.exclude]
glob = ["*.ja.md", "requirements.txt"]

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions.toc]
permalink = true
slugify = { object = "pymdownx.slugs.slugify", kwds = { case = "lower" } }
[project.markdown_extensions."pymdownx.details"]
[project.markdown_extensions."pymdownx.superfences"]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

# The Japanese site, read by scripts/build_docs.py only (Zensical reads [project]). Pages
# without a .ja.md translation are served in English under /ja/ as well.
[i18n.ja.nav]
"Home" = "ホーム"
"User guide" = "ユーザーガイド"
"Getting started" = "はじめに"
"How it works" = "仕組み"
"Measured transports (--stats)" = "実測 transport (--stats)"
"Developer guide" = "開発者ガイド"
"Architecture" = "Architecture (英語)"
"Development, verification and tests" = "開発・検証・テスト (英語)"
"Verification log" = "検証ログ (英語)"
