# Development and verification environment for fastdds_transport_viz.
#
#   docker compose build                        # ROS_DISTRO=humble|lyrical|rolling docker compose build => other distros
#   docker compose run --rm dev bash            # interactive shell, repo mounted at /ws
#   RMW_IMPLEMENTATION=rmw_fastrtps_dynamic_cpp docker compose run --rm dev bash
#                                               # every service honours the host's RMW_IMPLEMENTATION
#   docker compose up talker listener           # two containers => different "hosts" => UDPv4
#   docker compose up talker_stats listener_stats   # same, with FASTDDS_STATISTICS
#   docker compose up talker_stats_loss listener_stats_loss
#                                               # same, 20 Hz and NET_ADMIN for `tc netem` (#122)
#   scripts/multicast_stamping_test.sh          # profile `multicast`: a multi-homed sender
#                                               # inflates the receiver's RTPS_LOST (#130)
#   docker compose up talker_large_data listener_large_data   # LARGE_DATA => TCPv4
#   docker compose up talker_udpv6 listener_udpv6   # DEFAULTv6 => UDPv6
#   docker compose up pair_shm                  # talker + listener in one container => SHM
#   docker compose run --rm -d hostnet ros2 run demo_nodes_cpp talker
#   docker compose run --rm -d hostnet ros2 run demo_nodes_cpp listener
#                                               # host network + IPC => same host id => SHM
#   docker compose up pair_hostnet_noipc        # host network, own IPC => the tool in hostnet
#                                               # sees none of their SHM ports (shm-not-visible)
#   docker compose up talker_hostnet_split listener_hostnet_split
#                                               # host network, an IPC namespace each => Fast DDS
#                                               # picks SHM and nothing arrives (shm-ipc-namespace-split)
#   docker compose up talker_hostnet_split_stats listener_hostnet_split_stats
#                                               # same, with FASTDDS_STATISTICS: --stats from `hostnet`
#                                               # still receives their statistics (#106)
#   docker compose up talker_hostnet_split_shared listener_hostnet_split_shared
#                                               # same split, the talker's 7000+ number also
#                                               # taken in the listener's namespace (#118)
#   docker compose up bounded_pub_hostnet_split bounded_sub_hostnet_split
#                                               # the same split with data-sharing: nothing
#                                               # arrives either (shm-ipc-namespace-split, #110)
#   ROS_DISTRO=jazzy docker compose --profile scale build nav2_tb3
#   scripts/scale_test.sh small|medium|large|limit|large_multi|nav2
#                                               # scale verification (#74): scale_load_a / _b,
#                                               # nav2_tb3 (profile `scale`, not in CI)
#
# Run transport_viz from inside the same network/IPC scope as the nodes you
# want to observe (see README). scripts/integration_test.sh drives these
# services and asserts the expected transports.

x-base: &base
  build:
    context: .
    dockerfile: docker/Dockerfile
    args:
      ROS_DISTRO: ${ROS_DISTRO:-jazzy}
  image: fastdds_transport_viz:${ROS_DISTRO:-jazzy}
  volumes:
    - ./:/ws
  environment:
    - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}

# Fast DDS statistics on the observed nodes (see docs/statistics.md).
# The installed statistics.xml: CMake generates it for the Fast DDS of the build (#152).
x-stats-env: &stats_env
  ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
  RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
  FASTDDS_STATISTICS: RTPS_SENT_TOPIC;RTPS_LOST_TOPIC;HISTORY_LATENCY_TOPIC;PHYSICAL_DATA_TOPIC;DATA_COUNT_TOPIC;RESENT_DATAS_TOPIC;HEARTBEAT_COUNT_TOPIC;ACKNACK_COUNT_TOPIC;NACKFRAG_COUNT_TOPIC;GAP_COUNT_TOPIC
  FASTRTPS_DEFAULT_PROFILES_FILE: /ws/build/${ROS_DISTRO:-jazzy}/install/fastdds_transport_viz/share/fastdds_transport_viz/config/statistics.xml

# User endpoints on a multicast group (defaultMulticastLocatorList 239.255.0.7:7900) with
# statistics, for the RTPS_LOST multicast experiment of #130
# (scripts/multicast_stamping_test.sh). The generated profile merges the statistics writer
# profiles, because Fast DDS reads a single profiles file.
x-mcast-env: &mcast_env
  ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
  RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
  FASTDDS_STATISTICS: RTPS_SENT_TOPIC;RTPS_LOST_TOPIC;HISTORY_LATENCY_TOPIC;PHYSICAL_DATA_TOPIC;DATA_COUNT_TOPIC;RESENT_DATAS_TOPIC;HEARTBEAT_COUNT_TOPIC;ACKNACK_COUNT_TOPIC;NACKFRAG_COUNT_TOPIC;GAP_COUNT_TOPIC
  FASTRTPS_DEFAULT_PROFILES_FILE: /ws/build/${ROS_DISTRO:-jazzy}/install/fastdds_transport_viz/share/fastdds_transport_viz/config/multicast_user_stats.xml
  FTV_MCAST_IFACES: ${FTV_MCAST_IFACES:-3}

# LARGE_DATA builtin transports (UDPv4 discovery, TCPv4 + SHM user data) with statistics.
x-large-data-env: &large_data_env
  ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
  RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
  FASTDDS_BUILTIN_TRANSPORTS: LARGE_DATA
  FASTDDS_STATISTICS: RTPS_SENT_TOPIC;RTPS_LOST_TOPIC;HISTORY_LATENCY_TOPIC;PHYSICAL_DATA_TOPIC;DATA_COUNT_TOPIC;RESENT_DATAS_TOPIC;HEARTBEAT_COUNT_TOPIC;ACKNACK_COUNT_TOPIC;NACKFRAG_COUNT_TOPIC;GAP_COUNT_TOPIC
  FASTRTPS_DEFAULT_PROFILES_FILE: /ws/build/${ROS_DISTRO:-jazzy}/install/fastdds_transport_viz/share/fastdds_transport_viz/config/statistics.xml

# Fast DDS 3.2+ Easy Mode (ROS2_EASY_MODE, Lyrical / Rolling; Kilted, out of scope since
# 1.1.0, has it too): every container spawns its own Discovery Server and points it at the
# talker's fixed address; user data goes over TCPv4 (P2P builtin transport, no multicast at
# all). Statistics enabled.
x-easy-mode-env: &easy_mode_env
  ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
  RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
  ROS2_EASY_MODE: 172.28.0.10
  FASTDDS_STATISTICS: RTPS_SENT_TOPIC;RTPS_LOST_TOPIC;HISTORY_LATENCY_TOPIC;PHYSICAL_DATA_TOPIC;DATA_COUNT_TOPIC;RESENT_DATAS_TOPIC;HEARTBEAT_COUNT_TOPIC;ACKNACK_COUNT_TOPIC;NACKFRAG_COUNT_TOPIC;GAP_COUNT_TOPIC
  FASTRTPS_DEFAULT_PROFILES_FILE: /ws/build/${ROS_DISTRO:-jazzy}/install/fastdds_transport_viz/share/fastdds_transport_viz/config/statistics.xml

# Data-sharing (zero-copy) for the bounded_pub / bounded_sub nodes of this package.
x-datasharing-env: &datasharing_env
  ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
  RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
  FASTRTPS_DEFAULT_PROFILES_FILE: /ws/src/fastdds_transport_viz/config/datasharing_auto.xml
  RMW_FASTRTPS_USE_QOS_FROM_XML: "1"

# The same without the SHM transport (Fast DDS 2.11+): data-sharing does not need it.
x-datasharing-udp-env: &datasharing_udp_env
  ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
  RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
  FASTRTPS_DEFAULT_PROFILES_FILE: /ws/src/fastdds_transport_viz/config/datasharing_auto.xml
  RMW_FASTRTPS_USE_QOS_FROM_XML: "1"
  FASTDDS_BUILTIN_TRANSPORTS: UDPv4

services:
  dev:
    <<: *base
    command: sleep infinity
    ipc: host
    ports:
      - "8765:8765"   # transport_viz_web --bind 0.0.0.0 (web viewer live mode)

  # Two separate containers: separate network + IPC namespaces => Fast DDS
  # assigns different host IDs => user data must go over UDPv4.
  talker:
    <<: *base
    command: ros2 run demo_nodes_cpp talker
  listener:
    <<: *base
    command: ros2 run demo_nodes_cpp listener

  # Same two containers with the statistics module enabled: --stats measures
  # UDPv4 and PHYSICAL_DATA reports two different host names.
  talker_stats:
    <<: *base
    environment: *stats_env
    command: ros2 run demo_nodes_cpp talker
  listener_stats:
    <<: *base
    environment: *stats_env
    command: ros2 run demo_nodes_cpp listener

  # The same with NET_ADMIN, so that `tc qdisc ... netem loss` can drop packets on one
  # container's egress (only the packets to the other node), and a 20 Hz talker for enough
  # packets per observation: RTPS_LOST is reported by the receiving side (#122). The type
  # follows demo_nodes_cpp's listener (example_interfaces/String on Lyrical and later).
  talker_stats_loss:
    <<: *base
    environment: *stats_env
    cap_add: [NET_ADMIN]
    command:
      - bash
      - -c
      - >-
        case "$$ROS_DISTRO" in humble|jazzy) t=std_msgs/msg/String ;; *) t=example_interfaces/msg/String ;; esac;
        exec ros2 topic pub -r 20 -n talker /chatter "$$t" '{data: hello}'
  listener_stats_loss:
    <<: *base
    environment: *stats_env
    cap_add: [NET_ADMIN]
    command: ros2 run demo_nodes_cpp listener

  # The multicast RTPS_LOST experiment of #130 (profile `multicast`, never started by
  # default; scripts/multicast_stamping_test.sh). Fast DDS stamps the statistics sequence
  # number inside the transport's per-socket send(), and a multicast send goes out on the
  # any-address socket plus one socket per interface, so a sender with N interfaces burns
  # N+1 sequence numbers per message while a receiver in another namespace gets one copy.
  # The sender sits on three networks and downs the ones it must not use before the
  # publisher starts: Fast DDS enumerates the interfaces once, at startup. The shared
  # network (172.28.x, where the listeners are) is always kept.
  talker_mcast:
    <<: *base
    profiles: [multicast]
    environment: *mcast_env
    cap_add: [NET_ADMIN]
    networks: [default, mcast_b, mcast_c]
    command:
      - bash
      - -c
      - >-
        set -e;
        addrs=$$(ip -o -4 addr show scope global);
        shared=$$(echo "$$addrs" | awk '$$4 ~ /^172\.28\./ {print $$2; exit}');
        n=1;
        for dev in $$(echo "$$addrs" | awk '{print $$2}' | sort -u); do
        if [ "$$dev" != "$$shared" ]; then n=$$((n+1));
        [ "$$n" -le "$${FTV_MCAST_IFACES:-3}" ] || ip link set "$$dev" down; fi; done;
        echo "== interfaces (FTV_MCAST_IFACES=$${FTV_MCAST_IFACES:-3}, shared=$$shared)"; ip -br addr;
        case "$$ROS_DISTRO" in humble|jazzy) t=std_msgs/msg/String ;; *) t=example_interfaces/msg/String ;; esac;
        exec ros2 topic pub -r 20 --qos-reliability best_effort -n talker /chatter "$$t" '{data: hello}'
  # Two listeners: Fast DDS sends user data to the group only when more than one reader
  # shares it (see config/unicast_discovery.xml). `ros2 topic echo`, not demo_nodes_cpp,
  # because the reader has to be BEST_EFFORT to match the publisher and the demo node does
  # not offer its subscription for QoS overrides. The metatraffic to 239.255.0.1:7400 is
  # multicast too, but a handful of announcements per window is too small to divide.
  listener_mcast:
    <<: *base
    profiles: [multicast]
    environment: *mcast_env
    command:
      - bash
      - -c
      - >-
        case "$$ROS_DISTRO" in humble|jazzy) t=std_msgs/msg/String ;; *) t=example_interfaces/msg/String ;; esac;
        exec ros2 topic echo --qos-reliability best_effort /chatter "$$t" > /dev/null
  listener_mcast2:
    <<: *base
    profiles: [multicast]
    environment: *mcast_env
    command:
      - bash
      - -c
      - >-
        case "$$ROS_DISTRO" in humble|jazzy) t=std_msgs/msg/String ;; *) t=example_interfaces/msg/String ;; esac;
        exec ros2 topic echo --qos-reliability best_effort /chatter "$$t" > /dev/null

  # The zero control: one network namespace, so the receiver also gets the copy the
  # any-address socket sends to localhost and sees no gap at all (#130).
  talker_mcast_hostnet:
    <<: *base
    profiles: [multicast]
    network_mode: host
    environment: *mcast_env
    command:
      - bash
      - -c
      - >-
        echo "== interfaces (host namespace)"; ip -br addr;
        case "$$ROS_DISTRO" in humble|jazzy) t=std_msgs/msg/String ;; *) t=example_interfaces/msg/String ;; esac;
        exec ros2 topic pub -r 20 --qos-reliability best_effort -n talker /chatter "$$t" '{data: hello}'
  listener_mcast_hostnet:
    <<: *base
    profiles: [multicast]
    network_mode: host
    environment: *mcast_env
    command:
      - bash
      - -c
      - >-
        case "$$ROS_DISTRO" in humble|jazzy) t=std_msgs/msg/String ;; *) t=example_interfaces/msg/String ;; esac;
        exec ros2 topic echo --qos-reliability best_effort /chatter "$$t" > /dev/null
  listener_mcast_hostnet2:
    <<: *base
    profiles: [multicast]
    network_mode: host
    environment: *mcast_env
    command:
      - bash
      - -c
      - >-
        case "$$ROS_DISTRO" in humble|jazzy) t=std_msgs/msg/String ;; *) t=example_interfaces/msg/String ;; esac;
        exec ros2 topic echo --qos-reliability best_effort /chatter "$$t" > /dev/null

  # The third check of #130: with an interface whitelist a UNICAST message goes out on every
  # whitelisted socket as well (read from the source), each copy carrying the number it was
  # stamped with, so what is measured here is that no false loss follows. The profile is
  # generated at startup, because the addresses are the container's own.
  talker_whitelist:
    <<: *base
    profiles: [multicast]
    environment: *stats_env
    networks: [default, mcast_b, mcast_c]
    command:
      - bash
      - -c
      - >-
        set -e;
        python3 /ws/scripts/whitelist_profile.py "$$FASTRTPS_DEFAULT_PROFILES_FILE" /tmp/whitelist_stats.xml;
        export FASTRTPS_DEFAULT_PROFILES_FILE=/tmp/whitelist_stats.xml;
        echo "== interfaces"; ip -br addr;
        case "$$ROS_DISTRO" in humble|jazzy) t=std_msgs/msg/String ;; *) t=example_interfaces/msg/String ;; esac;
        exec ros2 topic pub -r 20 -n talker /chatter "$$t" '{data: hello}'
  listener_whitelist:
    <<: *base
    profiles: [multicast]
    environment: *stats_env
    command: ros2 run demo_nodes_cpp listener

  # Same two containers with FASTDDS_BUILTIN_TRANSPORTS=LARGE_DATA: user data must go
  # over TCPv4 between them (SHM is not shared, discovery stays UDPv4).
  # One container for the delivered-rate verification (#143, integration_test.sh rate_stats):
  # rate_load processes and transport_viz --stats in the same host id and /dev/shm, with
  # statistics and data-sharing AUTO from the generated profile.
  rate_load:
    <<: *base
    environment:
      <<: *stats_env
      FASTRTPS_DEFAULT_PROFILES_FILE: /ws/build/${ROS_DISTRO:-jazzy}/install/fastdds_transport_viz/share/fastdds_transport_viz/config/datasharing_auto_stats.xml
      RMW_FASTRTPS_USE_QOS_FROM_XML: "1"
    command: sleep infinity

  talker_large_data:
    <<: *base
    environment: *large_data_env
    command: ros2 run demo_nodes_cpp talker
  listener_large_data:
    <<: *base
    environment: *large_data_env
    command: ros2 run demo_nodes_cpp listener

  # Same two containers with FASTDDS_BUILTIN_TRANSPORTS=DEFAULTv6 (UDPv6 + SHM): the
  # default network below has IPv6, user data must go over UDPv6 between them.
  talker_udpv6:
    <<: *base
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      - FASTDDS_BUILTIN_TRANSPORTS=DEFAULTv6
    command: ros2 run demo_nodes_cpp talker
  listener_udpv6:
    <<: *base
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      - FASTDDS_BUILTIN_TRANSPORTS=DEFAULTv6
    command: ros2 run demo_nodes_cpp listener

  # Same two containers in Easy Mode (Fast DDS 3.2+ only): fixed addresses so that
  # ROS2_EASY_MODE can name the talker's host; the listener's server meshes with it.
  talker_easy_mode:
    <<: *base
    environment: *easy_mode_env
    networks:
      default:
        ipv4_address: 172.28.0.10
    command: ros2 run demo_nodes_cpp talker
  listener_easy_mode:
    <<: *base
    environment: *easy_mode_env
    networks:
      default:
        ipv4_address: 172.28.0.11
    command: ros2 run demo_nodes_cpp listener

  # Shares the Docker host's network and IPC namespaces: two of these get the
  # same host id and the same /dev/shm => SHM. Also the service to use on each
  # machine of a real multi-host setup (docs/development.md).
  hostnet:
    <<: *base
    network_mode: host
    ipc: host
    command: sleep infinity

  # Same container: same host ID and shared /dev/shm => SHM.
  pair_shm:
    <<: *base
    command: bash -c "ros2 run demo_nodes_cpp talker & exec ros2 run demo_nodes_cpp listener"

  # Host network without the host IPC namespace: the Docker host's host id but a /dev/shm
  # of its own. Talker and listener share it, so /chatter is SHM between them; a tool in
  # `hostnet` holds none of their port locks (shm-not-visible).
  pair_hostnet_noipc:
    <<: *base
    network_mode: host
    command: bash -c "ros2 run demo_nodes_cpp talker & exec ros2 run demo_nodes_cpp listener"

  # Host network, an IPC namespace each: the same host id but two /dev/shm. Fast DDS still
  # selects SHM between them and the listener hears nothing; both announce the same SHM
  # port number (shm-port-collision), so a tool in `hostnet` tells the split (#101).
  talker_hostnet_split:
    <<: *base
    network_mode: host
    command: ros2 run demo_nodes_cpp talker
  listener_hostnet_split:
    <<: *base
    network_mode: host
    command: ros2 run demo_nodes_cpp listener

  # The same split with the statistics module enabled. The tool in `hostnet` is in a third
  # IPC namespace; its statistics readers announce no SHM locator, so the statistics come
  # over UDPv4 and show SHM traffic that is never delivered (#106).
  talker_hostnet_split_stats:
    <<: *base
    network_mode: host
    environment: *stats_env
    command: ros2 run demo_nodes_cpp talker
  listener_hostnet_split_stats:
    <<: *base
    network_mode: host
    environment: *stats_env
    command: ros2 run demo_nodes_cpp listener

  # The same split seen from the talker's IPC namespace (`hostnet_in_talker_ipc`). A node
  # started first takes the 7000 port there, so the talker's numbers differ from the
  # listener's and only visibility tells the split (shm-reader-port-not-visible; Jazzy and
  # newer, Humble has no 7000 port to shift).
  talker_hostnet_split_visible:
    <<: *base
    network_mode: host
    ipc: shareable
    command: bash -c "ros2 run demo_nodes_cpp add_two_ints_server & until ls /dev/shm/*_port7000_el >/dev/null 2>&1; do sleep 0.2; done; exec ros2 run demo_nodes_cpp talker"
  hostnet_in_talker_ipc:
    <<: *base
    network_mode: host
    ipc: service:talker_hostnet_split_visible
    command: sleep infinity

  # The same view with the talker's 7000+ number announced twice (#118): a node started first
  # in each namespace takes 7000, and a second one in the listener's takes 7001, the talker's
  # number. That shared number does not say whose lock the tool sees; the talker's own port
  # still does (shm-reader-port-not-visible; Jazzy and newer). Each node starts once the
  # previous one holds its port lock (docker/wait_shm_port.sh).
  talker_hostnet_split_shared:
    <<: *base
    network_mode: host
    ipc: shareable
    command: bash -c "ros2 run demo_nodes_cpp add_two_ints_server & bash /ws/docker/wait_shm_port.sh 7000; exec ros2 run demo_nodes_cpp talker"
  listener_hostnet_split_shared:
    <<: *base
    network_mode: host
    command: bash -c "ros2 run demo_nodes_cpp add_two_ints_server & bash /ws/docker/wait_shm_port.sh 7000; ros2 run demo_nodes_cpp add_two_ints_server & bash /ws/docker/wait_shm_port.sh 7001; exec ros2 run demo_nodes_cpp listener"
  hostnet_in_talker_shared_ipc:
    <<: *base
    network_mode: host
    ipc: service:talker_hostnet_split_shared
    command: sleep infinity

  # The split with data-sharing (#110): Fast DDS pairs the two as data-sharing on QoS alone,
  # the reader cannot open the writer's history in the other /dev/shm and rejects the writer,
  # and nothing arrives. Both still take the same SHM port number (shm-port-collision).
  bounded_pub_hostnet_split:
    <<: *base
    network_mode: host
    environment: *datasharing_env
    command: ros2 run fastdds_transport_viz bounded_pub
  bounded_sub_hostnet_split:
    <<: *base
    network_mode: host
    environment: *datasharing_env
    command: ros2 run fastdds_transport_viz bounded_sub

  # The same with UDPv4 only: no SHM port to compare, so only the data-sharing segments tell
  # the split, seen from the writer's IPC namespace (`hostnet_in_bounded_pub_ipc`):
  # the writer's history is there, the reader's notification segment is not.
  bounded_pub_hostnet_split_udp:
    <<: *base
    network_mode: host
    ipc: shareable
    environment: *datasharing_udp_env
    command: ros2 run fastdds_transport_viz bounded_pub
  bounded_sub_hostnet_split_udp:
    <<: *base
    network_mode: host
    environment: *datasharing_udp_env
    command: ros2 run fastdds_transport_viz bounded_sub
  hostnet_in_bounded_pub_ipc:
    <<: *base
    network_mode: host
    ipc: service:bounded_pub_hostnet_split_udp
    command: sleep infinity

  # Scale verification (#74, scripts/scale_test.sh): SCALE_PROCESSES scale_load processes of one
  # node each sharing SCALE_TOPICS topics, with FASTDDS_STATISTICS. One container for every
  # rung (the tool runs in it with `docker compose exec`: same host id and /dev/shm); for
  # `large_multi` the processes are split between scale_load_a and the bridged scale_load_b.
  scale_load_a:
    <<: *base
    profiles: [scale]
    environment:
      <<: *stats_env
      SCALE_PROCESSES: ${SCALE_PROCESSES:-10}
      SCALE_TOPICS: ${SCALE_TOPICS:-100}
      SCALE_FIRST: ${SCALE_A_FIRST:-0}
      SCALE_LAST: ${SCALE_A_LAST:-}
    ipc: shareable
    shm_size: 2gb
    command: bash /ws/docker/scale_load.sh
  scale_load_b:
    <<: *base
    profiles: [scale]
    environment:
      <<: *stats_env
      SCALE_PROCESSES: ${SCALE_PROCESSES:-10}
      SCALE_TOPICS: ${SCALE_TOPICS:-100}
      SCALE_FIRST: ${SCALE_B_FIRST:-0}
      SCALE_LAST: ${SCALE_B_LAST:-}
    shm_size: 2gb
    command: bash /ws/docker/scale_load.sh

  # Nav2 with the TurtleBot3 simulation, Gazebo headless, no goals: a real system for the scale
  # verification (Jazzy only, Kilted is out of scope since 1.1.0; image target `nav2` of
  # docker/Dockerfile). The initial pose is published until AMCL takes it, so that the whole
  # navigation stack becomes active.
  nav2_tb3:
    <<: *base
    profiles: [scale]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: nav2
      args:
        ROS_DISTRO: ${ROS_DISTRO:-jazzy}
    image: fastdds_transport_viz:${ROS_DISTRO:-jazzy}-nav2
    environment:
      <<: *stats_env
    ipc: shareable
    shm_size: 2gb
    command:
      - bash
      - -c
      - >-
        ros2 launch nav2_bringup tb3_simulation_launch.py headless:=True use_rviz:=False &
        sleep 30;
        for i in 1 2 3; do
        ros2 topic pub --once /initialpose geometry_msgs/msg/PoseWithCovarianceStamped
        '{header: {frame_id: map}, pose: {pose: {position: {x: -2.0, y: -0.5}, orientation: {w: 1.0}}}}';
        sleep 5; done;
        wait

# IPv6 on the project network so that UDPv6 / DEFAULTv6 can be exercised (Docker >= 27
# needs no daemon configuration for this).
networks:
  default:
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.28.0.0/16
        - subnet: fd00:fd00:7a1e::/64
  # Two more bridges so that one container can have two or three interfaces: the multicast
  # experiment of #130 needs a multi-homed sender. Only the `multicast` profile uses them.
  mcast_b:
    ipam:
      config:
        - subnet: 172.29.0.0/16
  mcast_c:
    ipam:
      config:
        - subnet: 172.30.0.0/16
